<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Audio Note Taker</title>
    <meta
      name="description"
      content="Capture whole-system laptop audio and microphone streams, transcribe verbatim, auto-correct grammar with inline diffs, and synthesize structured summaries."
    />
    <meta property="og:title" content="System Audio Note Taker" />
    <meta
      property="og:description"
      content="Capture whole-system laptop audio and microphone streams, transcribe verbatim, auto-correct grammar with inline diffs, and synthesize structured summaries."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          if (localStorage.getItem('sant_theme') === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 antialiased selection:bg-indigo-500/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
